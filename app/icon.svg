<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="The Emergent Ventures Gazetteer">
  <!--
    The site's programme diagram at icon scale: a spine with branch rows of
    differing length. Two inks, and it inverts in a dark browser tab so the
    tile never disappears into the chrome.
  -->
  <style>
    .tile { fill: #000000 }
    .mark { fill: #ffffff }
    @media (prefers-color-scheme: dark) {
      .tile { fill: #ffffff }
      .mark { fill: #141414 }
    }
  </style>
  <rect class="tile" width="32" height="32" rx="6.5"/>
  <g class="mark">
    <rect x="7.5" y="7" width="3.2" height="18"/>
    <rect x="13.5" y="7.6" width="11.5" height="3.2"/>
    <rect x="13.5" y="14.4" width="6.5" height="3.2"/>
    <rect x="13.5" y="21.2" width="9" height="3.2"/>
  </g>
</svg>
