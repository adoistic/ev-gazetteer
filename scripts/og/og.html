<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:'Cormorant Garamond';src:url('../../public/fonts/CormorantGaramond-variable.woff2') format('woff2');font-weight:300 700;font-style:normal}
@font-face{font-family:'Cormorant Garamond';src:url('../../public/fonts/CormorantGaramond-Italic-variable.woff2') format('woff2');font-weight:300 700;font-style:italic}
@font-face{font-family:'Teachers';src:url('../../public/fonts/Teachers-variable.woff2') format('woff2');font-weight:400 800;font-style:normal}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1200px;height:630px}
body{background:#000;color:#fff;font-family:'Teachers',sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden}

.card{position:absolute;inset:0;padding:54px 68px 46px 84px;display:flex;flex-direction:column}
/* Hatching is the one permitted second fill in this identity. */
.edge{position:absolute;left:0;top:0;bottom:0;width:14px;
  background-image:repeating-linear-gradient(45deg,#fff 0 1.5px,#000 1.5px 4px)}

.top{flex:1;display:grid;grid-template-columns:1.45fr 1fr;gap:56px;align-items:center}
.eyebrow{font-size:16px;font-weight:700;letter-spacing:.3em;text-transform:uppercase}
h1{font-family:'Cormorant Garamond',serif;font-weight:400;font-size:96px;line-height:.95;
  letter-spacing:-.018em;margin-top:20px}
h1 em{font-style:italic}
.narration{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:31px;line-height:1.32;
  padding-bottom:10px}

.rule{height:2px;background:#fff;margin-top:36px}
.stats{display:flex;margin-top:22px}
.stat{flex:1}
.stat dt{font-size:13px;font-weight:700;letter-spacing:.22em;text-transform:uppercase}
.stat dd{font-family:'Cormorant Garamond',serif;font-size:58px;line-height:1;margin-top:6px;
  font-feature-settings:'lnum' 1,'tnum' 1}

.foot{display:flex;align-items:baseline;justify-content:space-between;margin-top:26px}
.url{font-size:22px;font-weight:700;letter-spacing:.09em}
.by{font-size:15px;letter-spacing:.03em}
</style></head>
<body>
  <div class="edge"></div>
  <div class="card">
    <div class="top">
      <div>
        <p class="eyebrow">Emergent Ventures</p>
        <h1>Every winner,<br><em>classified</em></h1>
      </div>
      <p class="narration">Every grant read and tagged, so a search for a subject finds the people working on it.</p>
    </div>

    <div class="rule"></div>
    <dl class="stats">
      <div class="stat"><dt>Grants</dt><dd>1,266</dd></div>
      <div class="stat"><dt>People</dt><dd>1,221</dd></div>
      <div class="stat"><dt>Countries</dt><dd>74</dd></div>
      <div class="stat"><dt>Fields</dt><dd>25</dd></div>
    </dl>
    <div class="foot">
      <span class="url">evwinners.thothica.com</span>
      <span class="by">Built on Nabeel Qureshi&rsquo;s Emergent Ventures Winners</span>
    </div>
  </div>
</body></html>
