<!doctype html><html><head><meta charset="utf-8">
<style>
@font-face{font-family:'Cormorant Garamond';src:url('../../public/fonts/CormorantGaramond-variable.woff2') format('woff2');font-weight:300 700}
body{margin:0;background:#fff;font-family:system-ui;padding:24px;display:flex;gap:34px}
.col{text-align:center}
.name{font-size:11px;letter-spacing:.1em;text-transform:uppercase;margin-bottom:10px}
.row{display:flex;gap:14px;align-items:flex-end;margin-bottom:14px}
svg{display:block}
.lab{font-size:9px;color:#666;margin-top:4px}
</style></head><body>
<!-- A: spine and branches, the site's own diagram grammar -->
<div class="col"><div class="name">A spine</div>
<div class="row">
<div><svg width="64" height="64" viewBox="0 0 32 32"><rect width="32" height="32" rx="6" fill="#000"/><rect x="8" y="8" width="2.4" height="16" fill="#fff"/><rect x="13" y="8.7" width="12" height="2.6" fill="#fff"/><rect x="13" y="14.7" width="8" height="2.6" fill="#fff"/><rect x="13" y="20.7" width="10.5" height="2.6" fill="#fff"/></svg><div class="lab">64</div></div>
<div><svg width="32" height="32" viewBox="0 0 32 32"><rect width="32" height="32" rx="6" fill="#000"/><rect x="8" y="8" width="2.4" height="16" fill="#fff"/><rect x="13" y="8.7" width="12" height="2.6" fill="#fff"/><rect x="13" y="14.7" width="8" height="2.6" fill="#fff"/><rect x="13" y="20.7" width="10.5" height="2.6" fill="#fff"/></svg><div class="lab">32</div></div>
<div><svg width="16" height="16" viewBox="0 0 32 32"><rect width="32" height="32" rx="6" fill="#000"/><rect x="8" y="8" width="2.4" height="16" fill="#fff"/><rect x="13" y="8.7" width="12" height="2.6" fill="#fff"/><rect x="13" y="14.7" width="8" height="2.6" fill="#fff"/><rect x="13" y="20.7" width="10.5" height="2.6" fill="#fff"/></svg><div class="lab">16</div></div>
</div></div>

<!-- B: three ranked bars, no spine, heavier -->
<div class="col"><div class="name">B ranked</div>
<div class="row">
<div><svg width="64" height="64" viewBox="0 0 32 32"><rect width="32" height="32" rx="6" fill="#000"/><rect x="7" y="8" width="18" height="4" fill="#fff"/><rect x="7" y="14" width="12" height="4" fill="#fff"/><rect x="7" y="20" width="15" height="4" fill="#fff"/></svg><div class="lab">64</div></div>
<div><svg width="32" height="32" viewBox="0 0 32 32"><rect width="32" height="32" rx="6" fill="#000"/><rect x="7" y="8" width="18" height="4" fill="#fff"/><rect x="7" y="14" width="12" height="4" fill="#fff"/><rect x="7" y="20" width="15" height="4" fill="#fff"/></svg><div class="lab">32</div></div>
<div><svg width="16" height="16" viewBox="0 0 32 32"><rect width="32" height="32" rx="6" fill="#000"/><rect x="7" y="8" width="18" height="4" fill="#fff"/><rect x="7" y="14" width="12" height="4" fill="#fff"/><rect x="7" y="20" width="15" height="4" fill="#fff"/></svg><div class="lab">16</div></div>
</div></div>

<!-- C: serif G -->
<div class="col"><div class="name">C letter</div>
<div class="row">
<div><svg width="64" height="64" viewBox="0 0 32 32"><rect width="32" height="32" rx="6" fill="#000"/><text x="16" y="24.5" font-family="Cormorant Garamond, serif" font-size="26" fill="#fff" text-anchor="middle">G</text></svg><div class="lab">64</div></div>
<div><svg width="32" height="32" viewBox="0 0 32 32"><rect width="32" height="32" rx="6" fill="#000"/><text x="16" y="24.5" font-family="Cormorant Garamond, serif" font-size="26" fill="#fff" text-anchor="middle">G</text></svg><div class="lab">32</div></div>
<div><svg width="16" height="16" viewBox="0 0 32 32"><rect width="32" height="32" rx="6" fill="#000"/><text x="16" y="24.5" font-family="Cormorant Garamond, serif" font-size="26" fill="#fff" text-anchor="middle">G</text></svg><div class="lab">16</div></div>
</div></div>

<!-- D: two bars with a hatched marker, the "elsewhere" grammar -->
<div class="col"><div class="name">D marker</div>
<div class="row">
<div><svg width="64" height="64" viewBox="0 0 32 32"><rect width="32" height="32" rx="6" fill="#000"/><rect x="7" y="9" width="5" height="14" fill="#fff"/><rect x="14.5" y="9" width="10.5" height="4" fill="#fff"/><rect x="14.5" y="15" width="7" height="4" fill="#fff"/><rect x="14.5" y="21" width="9" height="2" fill="#fff"/></svg><div class="lab">64</div></div>
<div><svg width="32" height="32" viewBox="0 0 32 32"><rect width="32" height="32" rx="6" fill="#000"/><rect x="7" y="9" width="5" height="14" fill="#fff"/><rect x="14.5" y="9" width="10.5" height="4" fill="#fff"/><rect x="14.5" y="15" width="7" height="4" fill="#fff"/><rect x="14.5" y="21" width="9" height="2" fill="#fff"/></svg><div class="lab">32</div></div>
<div><svg width="16" height="16" viewBox="0 0 32 32"><rect width="32" height="32" rx="6" fill="#000"/><rect x="7" y="9" width="5" height="14" fill="#fff"/><rect x="14.5" y="9" width="10.5" height="4" fill="#fff"/><rect x="14.5" y="15" width="7" height="4" fill="#fff"/><rect x="14.5" y="21" width="9" height="2" fill="#fff"/></svg><div class="lab">16</div></div>
</div></div>
</body></html>
