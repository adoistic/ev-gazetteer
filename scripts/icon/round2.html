<!doctype html><html><head><meta charset="utf-8">
<style>
@font-face{font-family:'Cormorant Garamond';src:url('../../public/fonts/CormorantGaramond-variable.woff2') format('woff2');font-weight:300 700}
body{margin:0;background:#fff;font-family:system-ui;padding:22px;display:flex;gap:30px}
.col{text-align:center}.name{font-size:11px;letter-spacing:.1em;text-transform:uppercase;margin-bottom:10px}

.onlight{background:#fff;padding:4px}.ondark{background:#141414;padding:4px}

<div class="col"><div class="name">A2 spine, heavier</div><div class="row">

</div></div>

</div></div>
